# Desenvolvimento: só a base de dados PostgreSQL, para quem queira trabalhar
# contra Postgres em vez do SQLite por omissão. A API e o frontend correm
# fora do Docker (ver README ou start.bat). Ligue a API com:
#   DATABASE_URL=postgresql://finance_user:finance_dev@localhost:5432/finance_ai_db
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: finance_dev
      POSTGRES_DB: finance_ai_db
    ports:
      # Só nesta máquina, não na rede.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
