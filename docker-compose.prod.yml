# Produção. Antes de arrancar:
#   1. cp .env.example .env  e preencha (DOMAIN, SECRET_KEY, POSTGRES_PASSWORD...)
#   2. aponte o DNS do domínio para este servidor (portas 80 e 443 abertas)
#   3. docker compose -f docker-compose.prod.yml up --build -d
#
# Só o Caddy está exposto à internet. Ele obtém e renova o certificado HTTPS
# sozinho e serve tudo no mesmo endereço: /api/* vai para o backend, o resto
# para o frontend — por isso o navegador nunca precisa de saber onde o backend
# está, e não há CORS entre domínios.

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financedb}
      POSTGRES_USER: ${POSTGRES_USER:-financeuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    # Sem "ports": a base de dados só é alcançável pelos outros contentores.
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Põe o esquema em dia uma vez, antes da API. Com a API a migrar ao arrancar,
  # os vários trabalhadores alteravam as mesmas tabelas ao mesmo tempo.
  migrate:
    build:
      context: ./backend
    environment: &backend-env
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-financeuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-financedb}
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      BACKEND_CORS_ORIGINS: https://${DOMAIN:?defina DOMAIN no .env}
      APP_BASE_URL: https://${DOMAIN}
      AUTO_MIGRATE: "0"
      SCHEDULER_ENABLED: "0"
      SCHEDULER_INTERVAL_HOURS: ${SCHEDULER_INTERVAL_HOURS:-6}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Monitorização de erros (opcional): sem SENTRY_DSN fica desligada.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
      # Assistente com IA (opcional): sem ANTHROPIC_API_KEY responde em modo básico.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-1}
      ASSISTANT_RATE_LIMIT: ${ASSISTANT_RATE_LIMIT:-20}
      ASSISTANT_RATE_WINDOW_SECONDS: ${ASSISTANT_RATE_WINDOW_SECONDS:-600}
      # Onde ficam as faturas. Sem estas, ficam no volume "uploads" — que entra
      # na cópia de segurança diária, mas vive no mesmo servidor.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-finance-ai-documents}
      R2_JURISDICTION: ${R2_JURISDICTION:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    command: ["python", "-m", "scripts.migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    restart: always
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  # As recorrências (rendas, avenças...) geradas num processo só, em vez de
  # um agendador por cada trabalhador da API.
  scheduler:
    build:
      context: ./backend
    restart: always
    environment:
      <<: *backend-env
    command: ["python", "-m", "scripts.run_scheduler"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        # Fica gravado no código do navegador durante a construção. Relativo,
        # porque o Caddy serve a API no mesmo domínio.
        NEXT_PUBLIC_API_URL: /api/v1
    restart: always
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: always
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  # Cópia de segurança diária da base de dados e das faturas guardadas em
  # disco, para ./backups, BACKUP_KEEP_DAYS dias (script: deploy/backup/backup.sh).
  # Com BACKUP_S3_BUCKET (+ endpoint e chaves), cada cópia segue também para um
  # bucket S3 compatível (ex. Cloudflare R2) — um backup no mesmo disco não
  # sobrevive à perda do disco. Com BACKUP_ENCRYPTION_PASSPHRASE, vai cifrada.
  # Restaurar: deploy/RESTORE.md. Testar à mão:
  #   docker compose -f docker-compose.prod.yml run --rm -e BACKUP_RUN_ONCE=1 backup
  backup:
    build:
      context: ./deploy/backup
    restart: always
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-financeuser}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-financedb}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-finance-ai}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_KEEP_DAYS: ${BACKUP_S3_KEEP_DAYS:-}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-}
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_prod_data:
  uploads:
  caddy_data:
  caddy_config:
