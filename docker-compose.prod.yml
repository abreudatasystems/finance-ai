version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finance_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financedb}
      POSTGRES_USER: ${POSTGRES_USER:-financeuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financepass123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeuser -d financedb"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance_backend_prod
    restart: always
    environment:
      DATABASE_URL: postgresql://financeuser:financepass123@postgres:5432/financedb
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-2026}
      # Onde ficam as faturas. Sem estas, ficam no disco do contentor — que
      # desaparece com ele, e uma fatura perdida é um lançamento sem suporte.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-finance-ai-documents}
      R2_JURISDICTION: ${R2_JURISDICTION:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finance_frontend_prod
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_prod_data:
