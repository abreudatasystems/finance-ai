name: CI

# Runs on every push and pull request. The point is that a change which breaks
# the VAT arithmetic, the tenant isolation or the settlement rules is caught
# here rather than by a customer.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # Sem o motor instalado, os testes de OCR saltam-se em silêncio — e o
      # que eles fixam é precisamente o que estava partido. A CI tem de os
      # correr a sério, com o dicionário português.
      - name: Install OCR engine
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-por

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        env:
          # The suite builds its own throwaway SQLite databases; this only has
          # to be set so the app can import.
          SECRET_KEY: ci-secret-not-used-outside-ci
        run: python -m pytest -q

  frontend:
    name: Frontend (lint + typecheck + unit tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # O lint corria só na máquina de quem se lembrasse dele, e por isso o
      # projeto acumulou 100 problemas sem ninguém dar por eles. Aqui falha
      # nos erros; os avisos que restam são das regras do compilador do React,
      # explicadas em eslint.config.mjs.
      - name: Lint
        working-directory: frontend
        run: npx eslint src

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      # Componentes base, formatação e cliente da API (Vitest + jsdom).
      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npx next build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # O playwright.config.ts arranca o backend (uvicorn, SQLite descartável)
      # e compila e serve o frontend apontado para ele.
      - name: Run end-to-end tests
        working-directory: frontend
        env:
          PYTHON: python
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
